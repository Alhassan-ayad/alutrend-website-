<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alutrend Dashboard</title>
<link rel="icon" href="../images/favicon.png">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="off">
    <img src="../images/logo.png" alt="Alutrend" class="login-logo">
    <h1>Dashboard</h1>
    <p>Sign in to manage images, team and footer.</p>
    <label>Password
      <input type="password" id="login-pw" autofocus required>
    </label>
    <div class="login-error" id="login-error" role="alert"></div>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><img src="../images/logo.png" alt=""><span>Dashboard</span></div>
    <nav id="nav">
      <a href="#/overview" data-view="overview">Overview</a>
      <a href="#/images" data-view="images">Images</a>
      <a href="#/team" data-view="team">Team</a>
      <a href="#/footer" data-view="footer">Footer</a>
      <a href="#/library" data-view="library">Media library</a>
      <a href="#/settings" data-view="settings">Settings</a>
    </nav>
    <div class="side-bottom">
      <a class="btn ghost block" href="../" target="_blank" rel="noopener">View website &#8599;</a>
      <button class="btn ghost block" id="logout">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div id="savebar" class="savebar" hidden>
      <span>You have unsaved changes</span>
      <span class="spacer"></span>
      <button class="btn ghost" id="discard">Discard</button>
      <button class="btn primary" id="save">Save &amp; publish</button>
    </div>
    <div id="view" class="view"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast" role="status"></div>
<script src="admin.js"></script>
</body>
</html>
